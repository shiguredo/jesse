name: ci

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/shiguredo/erlang:otp-28.1-openssl-3.6.0-beta1-ubuntu-24.04-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make ci
