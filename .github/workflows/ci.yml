name: ci

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: shiguredo/shiguredo-erlang:otp-26.2.1-openssl-3.2.0-ubuntu-22.04-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make ci
