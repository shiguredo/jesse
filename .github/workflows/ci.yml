name: ci

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: shiguredo/erlang:otp-27.3-openssl-3.5.0-ubuntu-24.04-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make ci
